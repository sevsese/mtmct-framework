[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtmct-framework"
version = "0.1.0"
description = "Hackathon-ready multi-target multi-camera tracking baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "opencv-python>=4.8",
  "ultralytics>=8.4",
  "huggingface_hub>=0.27",
  "ijson>=3.3",
]

[project.scripts]
mtmct = "mtmct.__main__:main"

[tool.setuptools.packages.find]
include = ["mtmct*"]

